# =============================================================================
#  Publishes the site whenever you push a change to GitHub.
#
#  You do not need to run anything yourself. Edit a content file in the
#  GitHub website, click "Commit changes", and about a minute later the
#  live site has updated.
#
#  If a build ever fails you'll get an email, and the "Actions" tab in your
#  repository shows exactly which line went wrong.
# =============================================================================
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you re-publish manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py uses only the Python standard library, so there is
      # nothing to install here. That is deliberate.
      - name: Build the site
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
